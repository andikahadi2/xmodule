<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Affiliate Content Engine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #faf8f3;
      --bg-elevated: #f2efe6;
      --bg-card: #ffffff;
      --border: #e5e0d5;
      --text: #292420;
      --text-muted: #756e63;
      --text-faint: #a39a8c;

      --primary: #5b6e4f;
      --primary-dark: #46573c;
      --accent: #c76a3f;
      --accent-dark: #a8532f;

      --success: #4d7c3f;
      --success-bg: #eef4e8;
      --warning: #b8860b;
      --warning-bg: #fbf3e0;
      --error: #b3402c;
      --error-bg: #fbeae5;
      --info: #46647a;
      --info-bg: #e9f0f4;

      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', sans-serif;
      --shadow-sm: 0 1px 2px rgba(41, 36, 32, 0.06);
      --shadow: 0 2px 8px rgba(41, 36, 32, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, .display {
      font-family: var(--font-display);
      letter-spacing: -0.01em;
      font-weight: 600;
      margin: 0;
    }

    a { color: inherit; }

    /* Top nav */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 18px;
      text-decoration: none;
      color: var(--text);
    }
    .topnav-brand .logo-dot {
      width: 9px; height: 9px; border-radius: 2px;
      background: var(--accent);
    }
    .topnav-links {
      display: flex;
      gap: 4px;
    }
    .topnav-links a {
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .topnav-links a:hover { background: var(--bg-elevated); color: var(--text); }
    .topnav-links a.active { background: var(--bg-elevated); color: var(--text); }

    .logout-form { margin: 0; }
    .logout-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-body);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .logout-btn:hover { background: var(--error-bg); color: var(--error); }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--bg-elevated); }
    .btn-danger {
      background: var(--error-bg);
      color: var(--error);
    }
    .btn-danger:hover { background: #f6dbd3; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Forms */
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], input[type="url"], input[type="file"], textarea, select {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text);
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .field { margin-bottom: 16px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: capitalize;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-error { background: var(--error-bg); color: var(--error); }
    .badge-info { background: var(--info-bg); color: var(--info); }
    .badge-neutral { background: var(--bg-elevated); color: var(--text-muted); }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    tr:last-child td { border-bottom: none; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-faint);
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="topnav">
    <a href="/" class="topnav-brand">
      <span class="logo-dot"></span>
      Content Engine
    </a>
    <div class="topnav-links">
      <a href="/" {% if active == 'home' %}class="active"{% endif %}>Home</a>
      <a href="/affiliate" {% if active == 'affiliate' %}class="active"{% endif %}>Affiliate</a>
      <a href="/clipper" {% if active == 'clipper' %}class="active"{% endif %}>Clipper</a>
      <a href="/clipper/history" {% if active == 'clipper-history' %}class="active"{% endif %}>History</a>
      <a href="/video-ai" {% if active == 'video-ai' %}class="active"{% endif %}>Generate Video AI</a>
      <form class="logout-form" method="post" action="/logout">
        <button type="submit" class="logout-btn">Keluar</button>
      </form>
    </div>
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
