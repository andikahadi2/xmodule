<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Affiliate Content Engine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg: #0b0f1a;
      --bg-elevated: #121829;
      --bg-card: #161d33;
      --border: #262f4a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-faint: #64748b;

      --primary: #3b82f6;
      --primary-dark: #1e40af;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.35);

      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.12);
      --info: #3b82f6;
      --info-bg: rgba(59, 130, 246, 0.12);

      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --font-display: 'Space Grotesk', 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59, 130, 246, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(168, 85, 247, 0.1), transparent);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    h1, h2, h3, .display {
      font-family: var(--font-display);
      letter-spacing: -0.02em;
      font-weight: 600;
      margin: 0;
    }

    a { color: inherit; }

    /* Top nav */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 26, 0.7);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 17px;
      text-decoration: none;
      color: var(--text);
    }
    .topnav-brand .logo-dot {
      width: 10px; height: 10px; border-radius: 3px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 0 16px var(--primary-glow);
    }
    .topnav-links {
      display: flex;
      gap: 4px;
    }
    .topnav-links a {
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }
    .topnav-links a:hover { background: var(--bg-card); color: var(--text); }
    .topnav-links a.active { background: var(--bg-card); color: var(--text); }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s, box-shadow 0.15s, background 0.15s;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 20px -4px var(--primary-glow);
    }
    .btn-primary:hover { box-shadow: 0 6px 24px -4px var(--primary-glow); }
    .btn-secondary {
      background: var(--bg-elevated);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger {
      background: var(--error-bg);
      color: var(--error);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Forms */
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], input[type="url"], input[type="file"], textarea, select {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text);
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .field { margin-bottom: 16px; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: capitalize;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-error { background: var(--error-bg); color: var(--error); }
    .badge-info { background: var(--info-bg); color: var(--info); }
    .badge-neutral { background: var(--bg-elevated); color: var(--text-muted); }

    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    tr:last-child td { border-bottom: none; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-faint);
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="topnav">
    <a href="/" class="topnav-brand">
      <span class="logo-dot"></span>
      Content Engine
    </a>
    <div class="topnav-links">
      <a href="/" {% if active == 'home' %}class="active"{% endif %}>Home</a>
      <a href="/affiliate" {% if active == 'affiliate' %}class="active"{% endif %}>Affiliate</a>
      <a href="/clipper" {% if active == 'clipper' %}class="active"{% endif %}>Clipper</a>
      <a href="/video-ai" {% if active == 'video-ai' %}class="active"{% endif %}>Generate Video AI</a>
    </div>
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
